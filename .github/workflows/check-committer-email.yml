name: Enforce Company Email for committer

on:
  pull_request:
  push:
  workflow_call:

jobs:
  check-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit emails
        shell: bash
        run: |
          set -euo pipefail

          # List of allowed corporate email domains
          ALLOWED_DOMAINS=(
            "@geminustech.com"
            "@geminus.space"
          )

          echo "Event: ${{ github.event_name }}"

          #
          # Determine the commit range
          #
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then

            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            echo "Checking commits in Pull Request"
            echo "Base SHA : $BASE_SHA"
            echo "Head SHA : $HEAD_SHA"

            COMMITS=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          elif [[ "${{ github.event_name }}" == "push" ]]; then

            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            echo "Checking commits in Push"
            echo "Base SHA : $BASE_SHA"
            echo "Head SHA : $HEAD_SHA"

            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              echo "First push detected."
              COMMITS=$(git rev-list "$HEAD_SHA")
            else
              COMMITS=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")
            fi

          else
            #
            # workflow_call executes in the caller's event context.
            # This is a fallback.
            #
            echo "Checking latest commit."
            COMMITS=$(git rev-list -1 HEAD)
          fi

          #
          # Function to validate email against allowed domains
          #
          is_valid_email() {
            local email="$1"

            for domain in "${ALLOWED_DOMAINS[@]}"; do
              if [[ "$email" == *"$domain" ]]; then
                return 0
              fi
            done

            return 1
          }

          HAS_ERRORS=false

          echo ""
          echo "Commits to validate:"
          echo "$COMMITS"
          echo ""

          for COMMIT in $COMMITS; do

            AUTHOR_EMAIL=$(git show -s --format='%ae' "$COMMIT")
            COMMITTER_EMAIL=$(git show -s --format='%ce' "$COMMIT")

            echo "----------------------------------------"
            echo "Commit    : $COMMIT"
            echo "Author    : $AUTHOR_EMAIL"
            echo "Committer : $COMMITTER_EMAIL"

            if ! is_valid_email "$AUTHOR_EMAIL"; then
              echo "❌ ERROR: Author email '$AUTHOR_EMAIL' is not from an approved corporate domain."
              HAS_ERRORS=true
            fi

            if ! is_valid_email "$COMMITTER_EMAIL"; then
              echo "❌ ERROR: Committer email '$COMMITTER_EMAIL' is not from an approved corporate domain."
              HAS_ERRORS=true
            fi

          done

          echo "----------------------------------------"

          if [[ "$HAS_ERRORS" == "true" ]]; then

            echo ""
            echo "Validation failed!"
            echo ""
            echo "All Git commits must use one of the following email domains:"
            for domain in "${ALLOWED_DOMAINS[@]}"; do
              echo "  - $domain"
            done

            echo ""
            echo "Configure Git using one of the approved email addresses:"
            echo ""

            for domain in "${ALLOWED_DOMAINS[@]}"; do
              echo "  git config user.email \"your.name${domain}\""
            done

            echo ""
            echo "If you have already committed with the wrong email:"
            echo ""
            echo "  git commit --amend --reset-author --no-edit"
            echo "  git push --force-with-lease"
            echo ""

            exit 1
          fi

          echo ""
          echo "✅ All commit author and committer emails are valid."

